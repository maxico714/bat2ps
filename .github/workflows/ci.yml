name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff mypy
      - name: Static (L0)
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src/
      - name: Unit + integration + e2e + adversarial
        run: pytest -q
      - name: Doctor
        run: bat2ps doctor
      - name: Harness corpus A
        run: bat2ps harness corpus/npocmaka-subset --min-pass 30
      - name: Harness corpus B
        run: bat2ps harness corpus/community-subset --min-pass 20
      - name: Honesty audit
        shell: pwsh
        run: |
          $hits = Select-String -Pattern "TODO|FIXME|placeholder" -Path src/bat2ps/*.py -ErrorAction SilentlyContinue
          if ($hits) { $hits; exit 1 }
