name: Bug report
description: Report a wrong conversion or crash
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Minimal .bat repro
      render: bat
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bat2ps version (`bat2ps --version`)
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: `bat2ps doctor` output
      render: text
  - type: textarea
    id: diff
    attributes:
      label: `bat2ps verify` diff (stdout/exit)
      render: text
